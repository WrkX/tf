name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Version must be unreleased
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=VERSION::'$version' is not a plain x.y.z version"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error file=VERSION::v$version is already tagged; bump VERSION"
            exit 1
          fi
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "::error file=VERSION::v$version is already released; bump VERSION"
            exit 1
          fi
          echo "v$version is unreleased"

  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build app bundle
        run: cargo xtask bundle
